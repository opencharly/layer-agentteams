version: 2026.261.1747
repo: github.com/opencharly/layer-agentteams
# The charly toolchain layer, declared at project scope so the
# check-agentteams-snapshot bed's add_candy dependency resolves: the
# `layer-agentteams-snapshot` candy composes the bare `charly` candy (the
# in-venue CLI the snapshot/apply round-trip needs), and a bare dependency
# resolves only against the CONSUMING project's candy closure. This repo's
# closure did not contain `charly`; declaring the toolchain here puts it in the
# closure without composing it into the production agentteams image.
charly-toolchain:
    candy:
        version: 2026.243.0408
        description: |-
            The charly toolchain layer (the on-PATH `charly` CLI plus its VM /
            encrypted-storage / console-relay stack), declared at project scope so
            the `charly` candy that `layer-agentteams-snapshot` composes resolves
            in this project's candy closure. The snapshot bed needs an in-venue
            `charly` for `charly agentteams snapshot|apply`; the production
            agentteams box deliberately does not carry it, so it is provided as a
            project-closure dependency, not composed into any image.
        candy:
            - '@github.com/opencharly/layer-charly:v2026.243.0408'
            # Pin the out-of-process pod deploy provider into the project closure
            # (the documented pattern for external builder/plugin candies: a
            # version-less provider ref otherwise resolves to the mutable "latest"
            # tag, so the bed's provider could silently skew to a schema it does
            # not accept). v2026.266.1057 is the spec-261 adopt
            # (opencharly/plugin-deploy-pod#12): it carries resolved_image through
            # config-setup, so `charly config` resolves the freshly-built bed image.
            # The older v2026.250.1020 predates that adopt — it drops resolved_image
            # and config fails "image not found in local storage". Pinned here to the
            # matching schema (2026.261.1747) so the bed resolves deterministically.
            - '@github.com/opencharly/plugin-deploy-pod/candy/plugin-deploy-pod:v2026.266.1057'
        plan:
            - check: the charly CLI is present on PATH
              id: charly-toolchain-binary
              file:
                file: /usr/bin/charly
                exists: true
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
    merge:
        auto: false
        max_mb: 128
discover:
    - path: candy
      recursive: true
    - path: box
      recursive: true
agentteams:
    candy:
        version: 2026.223.1500
        description: |-
            The AgentTeams top composition: the controller plus the four foundation
            services it embeds in one container — agentteams-minio (MinIO S3 +
            mc-mirror), agentteams-matrix (Tuwunel Matrix homeserver),
            agentteams-element (Element Web via rootless nginx), agentteams-higress
            (the Higress AI gateway: apiserver, controller, pilot, envoy gateway,
            console), and agentteams-controller (the kine-backed kube-apiserver +
            Manager/Worker/Team/Human reconciler serving the REST API on :8090).
            Every service runs as the image user (uid 1000) against its own
            home-relative volume (~/.agentteams/minio, ~/.agentteams/matrix,
            ~/.agentteams/higress, ~/.agentteams/controller) — the rootless charly
            architecture, no root anywhere, and each candy installable alone or
            together with any other. All service start scripts are charly-owned
            (written by the candies), not upstream AgentTeams scripts. Spawned
            Manager/Worker containers join the charly network and reach the
            controller — and every in-container service — by the controller
            container's DNS name.
        candy:
            - '@github.com/opencharly/pod-agentteams-minio:v2026.237.454'
            - '@github.com/opencharly/pod-agentteams-matrix:v2026.237.454'
            - '@github.com/opencharly/pod-agentteams-element:v2026.237.454'
            - '@github.com/opencharly/pod-agentteams-higress:v2026.237.454'
            - '@github.com/opencharly/pod-agentteams-controller:v2026.237.454'
        env:
            # Root-cause fix for the Higress gateway startup crash (R1). The
            # pod-agentteams-higress candy's start-gateway.sh execs pilot-agent with
            # `--concurrency=${GATEWAY_CONCURRENCY:-16}`; at the upstream default of 16
            # envoy's V8 WASM isolate initialisation segfaults once at startup (the
            # crash was first root-caused in opencharly/charly@55dc23ea and the candy
            # carries the `restart: always` self-heal for it). Pinning the worker
            # count to 1 removes the multi-threaded V8 isolate init that crashes, so
            # the gateway starts once and the checks no longer need to wait out a
            # crash/restart window. GATEWAY_CONCURRENCY is the candy's documented knob
            # (start-gateway.sh reads it); setting it here at the composition level
            # pins the envoy invocation for every consumer of this stack.
            GATEWAY_CONCURRENCY: "1"
        plan:
            - check: the full AgentTeams composition is present (controller, minio, matrix, element, higress)
              command: |
                  test -x /usr/local/bin/agentteams-controller &&
                  test -x /usr/local/bin/minio &&
                  test -x /usr/local/bin/tuwunel &&
                  test -f /opt/element-web/index.html &&
                  test -x /usr/local/bin/envoy
agentteams-skill:
    skill:
        name: agentteams
        family: agentteams
        owner: agentteams
        description: |-
            The AgentTeams multi-agent stack box (CachyOS base): the decomposed
            minio / matrix / element / higress / controller candies on both pod and
            vm substrates. MUST be invoked before building, deploying, configuring,
            or troubleshooting the agentteams box.
        triggers:
            - "the agentteams box / the AgentTeams multi-agent stack (Manager–Workers, Rooms, the controller + matrix + element + higress + minio candies) on the pod or vm substrate / the `check-agentteams-pod` and `check-agentteams-vm` beds"
        content: |-
            # agentteams

            AgentTeams is a multi-agent runtime built on a Manager–Workers model: a
            Manager plans and delegates, Workers execute, and they converse in shared
            Rooms (chat spaces on the Matrix homeserver). You would use it to run a
            team of AI agents that collaborate on a task. A controller — a mini
            Kubernetes API server (kube-apiserver v1.31.3 backed by a kine SQLite
            store; kine is a lightweight storage shim that backs the API server with
            SQLite) plus a reconciler (a loop that watches declared resources and
            drives the running system toward them) — manages four resource kinds
            (Manager, Worker, Team, Human) and serves a REST API on :8090. A Team is
            a group of Workers that share a Room; a Human is a real person — a
            human-in-the-loop participant with an identity and permission tier —
            who can observe and intervene in the Rooms their permissions allow. The
            controller spawns Manager containers through the container-runtime
            socket; a Manager creates Workers; Workers join Teams and converse in
            Rooms.

            This box ships that whole stack as a charly box: a CachyOS base composing
            five decomposed candies — `agentteams-minio` (MinIO S3 + mc-mirror),
            `agentteams-matrix` (Tuwunel, a Rust Matrix homeserver — the chat
            substrate), `agentteams-element` (Element Web via a rootless nginx),
            `agentteams-higress` (the Higress AI gateway: apiserver, controller,
            pilot, envoy gateway, console), and `agentteams-controller` (the
            kine-backed kube-apiserver + the Manager/Worker/Team/Human reconciler
            serving the REST API on :8090).

            Every service runs as the image user (uid 1000) — the rootless charly
            architecture, no root anywhere. Each candy owns its own home-relative
            volume, so any candy installs alone or together with any other at freely
            configurable locations. All service start scripts are charly-owned
            (written by the candies), never upstream AgentTeams scripts.

            ## How it works

            The controller is the entry point. On start it mints an admin service
            account (SA) token, then reconciles the declared Manager/Worker/Team/
            Human resources — for each Manager or Worker resource it spawns a
            container through the container-runtime socket. A Manager container runs
            the openclaw gateway (openclaw is an AI agent gateway runtime) plus the
            `agt` (AgentTeams CLI) and `mc` (MinIO client) tools; a Worker container
            runs the openclaw gateway plus the `agt` and `mc` tools and the shared
            AgentTeams protocol libs. Workers join Teams and converse in Rooms; the
            Matrix homeserver
            (Tuwunel) and the Higress AI gateway carry the traffic, and MinIO stores
            objects. The whole sequence is verifiable over the REST API:
            controller-spawns-manager → create-worker → room-exists.

            ## Composition

            | Entity | What it is |
            |---|---|
            | `agentteams` box | the deployable full-stack image (`base: cachyos.cachyos`) composing the `agentteams` top composition candy |
            | `agentteams-manager` image | the controller's Manager runtime — openclaw gateway + `agt` + `mc`; spawned by the controller, not deployed directly |
            | `agentteams-worker` image | the controller's Worker runtime — openclaw gateway + `agt` + `mc` + the shared AgentTeams protocol libs; spawned by the controller, not deployed directly |

            ## Volumes

            Home-relative, one per candy (freely configurable, installable in any combination):

            | Candy | Volume path | Backs |
            |---|---|---|
            | `agentteams-minio` | `~/.agentteams/minio` | MinIO objects |
            | `agentteams-matrix` | `~/.agentteams/matrix` | Tuwunel homeserver data |
            | `agentteams-higress` | `~/.agentteams/higress` | Higress data |
            | `agentteams-controller` | `~/.agentteams/controller` | kine SQLite, worker creds, admin token |

            `agentteams-element` has no volume (static nginx).

            ## Ports

            | Port | Service |
            |---|---|
            | 9000 / 9001 | MinIO S3 / console |
            | 6167 | Tuwunel Matrix homeserver |
            | 8088 | Element Web |
            | 8080 / 8001 | Higress gateway / console |
            | 8090 | controller REST API |

            Host mappings auto-allocate at deploy and resolve as `${HOST_PORT:<port>}`.

            ## Deploy

            ### Pod substrate

            `charly box build agentteams` then `charly fleet add` / `charly start` — or
            run the disposable bed end to end:

            ```
            charly check run check-agentteams-pod
            ```

            The bed binds the host rootless podman socket into the box, so the controller
            spawns the manager and worker containers through the SAME store the images
            were built into — no registry hop. Pre-build the spawn images first:

            ```
            charly box build agentteams-manager
            charly box build agentteams-worker
            ```

            ### VM substrate

            The `check-agentteams-vm` bed installs the top composition into an Arch
            cloud-image guest via `add_candy`; services run as systemd units under
            uid 1000 (init polymorphism — no supervisord in a VM):

            ```
            charly check run check-agentteams-vm
            ```

            The pre-built manager/worker images are delivered into the guest's rootless
            store with `charly vm cp-box`:

            ```
            charly vm cp-box agentteams-vm ghcr.io/opencharly/agentteams-manager:manager --rootless --domain check-agentteams-vm
            charly vm cp-box agentteams-vm ghcr.io/opencharly/agentteams-worker:worker --rootless --domain check-agentteams-vm
            ```

            ## Environment

            Deploy-overridable env: `AGENTTEAMS_MANAGER_IMAGE`, `AGENTTEAMS_WORKER_IMAGE`,
            `AGENTTEAMS_LLM_PROVIDER`, `AGENTTEAMS_OPENAI_BASE_URL`, `AGENTTEAMS_LLM_API_KEY`,
            `AGENTTEAMS_DEFAULT_MODEL`, `AGENTTEAMS_EMBEDDING_MODEL`,
            `AGENTTEAMS_ADMIN_USER` / `AGENTTEAMS_ADMIN_PASSWORD`,
            `AGENTTEAMS_MANAGER_RUNTIME`, `AGENTTEAMS_DEFAULT_WORKER_RUNTIME`,
            `AGENTTEAMS_MATRIX_APPSERVICE_ENABLED`. Secrets (the minio root password, the
            matrix registration token, the controller admin token) resolve from env or
            self-provisioned files — files the candies write at first start when the
            env var is unset: the controller's admin token at
            `/var/run/agentteams/cli-token`, the admin password at
            `~/.agentteams/controller/.admin-password`, the minio root password at
            `~/.agentteams/minio/.root-password`, the matrix registration token at
            `~/.agentteams/matrix/.registration-token`.

            ## Verification

            Each candy's ADE `plan:` ships deterministic checks (binary present, HTTP 200
            liveness, service running) — ADE (Agent Driven Evaluation) is charly's
            check framework: the spec is the test, baked into the image. The box-level
            checks prove the controller-spawns-manager → create-worker → room-exists
            sequence over the REST API (`charly check run check-agentteams-pod` /
            `check-agentteams-vm`).

            ## Cross-References

            - `/charly-agentteams:agentteams-cli` — the compiled-in `charly agentteams` management CLI.
            - `/charly-check:check` — the check-bed / ADE authoring surface.
            - `/charly-vm:vm` — the VM substrate, `charly vm cp-box`.
            - `/charly-internals:disposable` — the disposable-bed authorization model.

# =============================================================================
# check-agentteams-pod / -snapshot — the R10 beds for the AgentTeams stack on
# the POD substrate. Moved here from opencharly/charly's charly.yml, which cannot
# exercise the agentteams candy as in-development code (the bed's dev-tree
# override resolves the bed project's own superproject, not the candy owner), so
# the artifact owner tests its own composition locally.
#
# The pod bed binds the host rootless podman socket into the box so the
# controller can spawn the manager container from the pre-built
# agentteams-manager image (AGENTTEAMS_MANAGER_IMAGE) on the charly network.
#
# The VM-substrate bed (check-agentteams-vm + its agentteams-vm cloud-image
# template) has exactly ONE home (opencharly/charly) and is NOT a duplicate; it
# is outside this relocation because its green run is blocked on two named
# prerequisites. This PR advances the first — the project schema cutover to
# 2026.261.1747, tracked in opencharly/layer-agentteams#4 — by migrating this
# project to that schema. The remaining blocker is the plugin-deploy-vm
# step:system-packages hang, opencharly/plugin-deploy-vm#23.
# =============================================================================
check-agentteams-pod:
    pod:
        image: agentteams
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the full AgentTeams stack. Deploying the box to steady state proves the minio S3 API, the Tuwunel Matrix homeserver, the Element Web client, the Higress AI gateway, and the controller (kube-apiserver + REST API) all build, start, and stay up as uid 1000 against their own home-relative volumes (~/.agentteams/minio, ~/.agentteams/matrix, ~/.agentteams/higress, ~/.agentteams/controller) — and that the controller spawns the manager container from the pre-built agentteams-manager image through the host rootless podman socket (AGENTTEAMS_MANAGER_IMAGE), then creates a Worker CR and spawns the worker container from the pre-built agentteams-worker image (AGENTTEAMS_WORKER_IMAGE), which reaches Running and joins its Matrix room.
        volume:
            - name: podman-socket
              type: bind
              host: /run/user/1000/podman/podman.sock
              path: /run/user/1000/podman/podman.sock
        env:
            AGENTTEAMS_MANAGER_IMAGE: ghcr.io/opencharly/agentteams-manager:manager
            AGENTTEAMS_WORKER_IMAGE: ghcr.io/opencharly/agentteams-worker:worker
        security:
            security_opt:
                - label=disable
        plan:
            - check: the agentteams pod reached steady state
              id: agentteams-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-agentteams-pod
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the minio S3 API answers its health probe
              id: agentteams-minio-health
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:9000}/minio/health/live"
                status: 200
            - check: the Matrix homeserver answers the client versions endpoint
              id: agentteams-matrix-versions
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:6167}/_matrix/client/versions"
                status: 200
            - check: the Element Web client answers on its port
              id: agentteams-element-http
              timeout: 30s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:8088}/"
                status: 200
            - check: the Higress apiserver answers on its internal port
              id: agentteams-higress-apiserver
              timeout: 60s
              context:
                - runtime
              command: 'curl -sk https://127.0.0.1:18443/version | grep -q "gitVersion"'
            - check: the Higress gateway is healthy (pilot-agent + envoy answer the status port; bounded wait for the gateway to finish starting)
              id: agentteams-higress-gateway-health
              timeout: 60s
              context:
                - runtime
              command: 'for i in $(seq 1 30); do curl -sf http://127.0.0.1:15021/healthz/ready && exit 0; sleep 1; done; exit 1'
            - check: the Higress gateway serves the console on its ingress port (the 8080 listener materializes once the proxy node LABELS match the Gateway selector; bounded wait for the gateway to finish starting)
              id: agentteams-higress-gateway-http
              timeout: 60s
              context:
                - runtime
              command: |
                for i in $(seq 1 30); do
                    code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
                    [ "${code}" = "200" ] && exit 0
                    sleep 1
                done
                exit 1
            - check: the Higress console answers on its port
              id: agentteams-higress-console-http
              timeout: 60s
              context:
                - runtime
              http:
                http: "http://127.0.0.1:${HOST_PORT:8001}/"
                status: 200
            - # The `agentteams:` check verb (the declarative controller-probe counterpart of
              # the `charly agentteams` command plugin) replaces the raw curl sequence: the
              # provider resolves the controller's in-venue :8090 to a host-routable address
              # over the reverse channel (the box's published port), pulls the admin SA token
              # from the venue, and probes with the SAME apiClient the command uses (R3 — one
              # REST surface covers the CLI and every bed).
              check: the controller spawns the default manager and it reaches Running phase (proves the manager image is in the host store under AGENTTEAMS_MANAGER_IMAGE and the controller can spawn it through the bound podman socket)
              id: agentteams-manager-running
              timeout: 300s
              context:
                - runtime
              agentteams:
                method: manager-running
              stdout:
                - contains: "Running"
            - check: the controller creates a Worker CR, spawns the worker container from the pre-built agentteams-worker image, and the worker reaches Running with its Matrix room created (proves AGENTTEAMS_WORKER_IMAGE is in the host store and the controller can spawn the worker through the bound podman socket)
              id: agentteams-worker-running
              timeout: 300s
              context:
                - runtime
              agentteams:
                method: worker-running
              stdout:
                - contains: "room alias resolvable"
            - # The `agentteams:` check verb exercised LIVE against the running controller —
              # the declarative counterpart of the compiled-in `charly agentteams` command
              # plugin. The verb is HOST-BASED (the mcp pattern): the provider resolves the
              # controller's in-venue :8090 to a host-routable address over the reverse
              # channel (the box's published port), pulls the admin SA token from the venue,
              # and probes with the SAME apiClient the command uses (R3 — one REST surface
              # covers the CLI and every bed).
              check: "the `agentteams: status` verb reaches the live controller with the admin token and reports the resource counts"
              id: agentteams-plugin-status
              timeout: 60s
              context:
                - runtime
              agentteams:
                method: status
              stdout:
                - contains: "Total Workers:"
            - check: "the `agentteams: worker-list` verb lists the bed-worker the controller spawned (proves the verb's REST client + token discovery work end-to-end)"
              id: agentteams-plugin-worker-list
              timeout: 60s
              context:
                - runtime
              agentteams:
                method: worker-list
              stdout:
                - contains: "bed-worker"
            - # The compiled-in `charly agentteams config` command reports the controller
              # endpoint WITHOUT any network — a deterministic live proof that the CLI's
              # default fallback matches the box's actual host-mapped port. The controller
              # serves :8090 in-container and the box host-maps it by default
              # auto-allocation, so the default is http://127.0.0.1:8090 (the R4a fix that
              # replaced the unreachable upstream 18090 published-port default). The env is
              # cleared so a host-shell AGENTTEAMS_CONTROLLER_URL cannot mask the default.
              check: the compiled-in `charly agentteams config` command reports the controller endpoint default 8090
              id: agentteams-plugin-config-default
              timeout: 60s
              context:
                - runtime
              command:
                command: |
                    unset AGENTTEAMS_CONTROLLER_URL AGENTTEAMS_AUTH_TOKEN AGENTTEAMS_AUTH_TOKEN_FILE
                    "${CHARLY_BIN}" agentteams config
                in_container: false
              stdout:
                - contains: "Controller URL: http://127.0.0.1:8090"
# check-agentteams-snapshot — the R10 bed for Factory Unit 6, the snapshot/hydrate
# round-trip.
#
# The round-trip is asserted by STATE THAT SURVIVES IT, never by the two commands
# exiting 0 — a snapshot that writes an empty bundle and a hydrate that applies
# nothing both exit 0, so exit status cannot distinguish a working round-trip from
# a vacuous one.
#
# The worker is DELETED between snapshot and apply and its absence asserted. That
# is what makes the hydrate half discriminate: `charly agentteams apply` never
# deletes (control.go's applyPathWithClient has no delete path), so with the worker
# left in place a completely vacuous hydrate would still satisfy the final
# assertion. Without the delete the check could not fail for the reason it names.
#
# The check runs INSIDE the controller pod: the controller serves its REST API on
# 127.0.0.1:8090 and refuses a connection from outside, so a host-side invocation
# cannot reach it. The `agentteams` box deliberately does NOT carry the charly
# toolchain — it is a production composition — so the bed overlays
# candy/agentteams-snapshot via add_candy: on the DEPLOY rather than bloating the
# box for a check.
check-agentteams-snapshot:
    pod:
        image: agentteams
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for Factory Unit 6. Proves the snapshot/hydrate round-trip against a live AgentTeams deploy: the controller's worker is captured into a hydration bundle, the worker is DELETED, the bundle is applied back, and the worker is listed again.
        add_candy:
            - '@github.com/opencharly/layer-agentteams-snapshot:v2026.239.1618'
        volume:
            - name: podman-socket
              type: bind
              host: /run/user/1000/podman/podman.sock
              path: /run/user/1000/podman/podman.sock
        env:
            AGENTTEAMS_MANAGER_IMAGE: ghcr.io/opencharly/agentteams-manager:manager
            AGENTTEAMS_WORKER_IMAGE: ghcr.io/opencharly/agentteams-worker:worker
        security:
            security_opt:
                - label=disable
        plan:
            - check: the snapshot/hydrate round-trip preserves the controller's worker
              id: snapshot-roundtrip
              exit_status: 0
              stdout:
                - contains: ROUNDTRIP-OK
              context:
                - runtime
              command:
                command: >-
                    sh -c 'set -e; charly agentteams worker list | grep -q bed-worker || charly agentteams worker create --name bed-worker --no-wait; charly agentteams worker list | grep -q bed-worker; rm -rf /tmp/at-snap; charly agentteams snapshot --out /tmp/at-snap >/dev/null; test -s /tmp/at-snap/workers.yml; grep -q bed-worker /tmp/at-snap/workers.yml; charly agentteams worker delete bed-worker >/dev/null; ! charly agentteams worker list | grep -q bed-worker; charly agentteams apply -f /tmp/at-snap >/dev/null; charly agentteams worker list | grep -q bed-worker; echo ROUNDTRIP-OK'
                in_container: true
